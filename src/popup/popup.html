<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Project Hermes</title>
  </head>
  <body>
    <main>
      <h1>Webby</h1>
      <button id="btn-signin">Highlight “Sign in”</button>
      <div class="row">
        <input id="by-text" placeholder="Find by visible text (e.g., Checkout)" />
        <button id="btn-by-text">Highlight</button>
      </div>
      <button id="btn-clear" class="ghost">Clear highlights</button>
      <button id="reload-ext" class="ghost">Reload(dev)</button>
      <script>
      document.getElementById('reload-ext')?.addEventListener('click', () => {
        chrome.runtime.reload();
      });
      </script>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
