<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hermes Side Panel</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; }
    main { padding: 12px; }
    textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 8px; padding: 8px; }
    button { margin-top: 8px; padding: 8px 12px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h2>Hermes Guidance</h2>
    <textarea id="prompt" placeholder="Ask Hermes (e.g., ‘help me pay this bill’)…"></textarea>
    <button id="run">(Future) Ask AI</button>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
